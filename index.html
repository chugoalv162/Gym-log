<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi registro de gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a66;--bd:#e2e0d8;--ac:#0f766e;--ac2:#ccfbf1;--up:#15803d;--dn:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#201f1e;--tx:#f0efe9;--mu:#a09e96;--bd:#35332f;--ac:#2dd4bf;--ac2:#134e4a;--up:#4ade80;--dn:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--card:#201f1e;--tx:#f0efe9;--mu:#a09e96;--bd:#35332f;--ac:#2dd4bf;--ac2:#134e4a;--up:#4ade80;--dn:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px 2px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:12.5px;font-weight:600}
nav button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:0}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}
button.b{padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
button.x{border:none;background:none;color:var(--dn);font-size:18px;padding:4px 8px}
input,select{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{text-align:center;font-size:12px;color:var(--mu)}
.d{min-height:62px;border:1px solid var(--bd);border-radius:8px;padding:3px;background:var(--card);cursor:pointer;overflow:hidden;font-size:11px}
.d.o{opacity:.35}.d.t{border-color:var(--ac);border-width:2px}
.d b{font-size:12px}
.chip{display:block;background:var(--ac2);color:var(--tx);border-radius:4px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set{display:grid;grid-template-columns:44px 44px 62px 56px 1fr 28px;gap:4px;margin-top:6px;align-items:center}
.set input,.set select{width:100%;padding:6px 4px}
.lab{display:grid;grid-template-columns:44px 44px 62px 56px 1fr 28px;gap:4px;font-size:11px;color:var(--mu);margin-top:6px}
.hint{background:var(--ac2);border-radius:8px;padding:6px 8px;margin:6px 0;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 label{font-size:12px;color:var(--mu);display:block}
.grid2 input{width:100%}
.sc{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;text-align:left}
.up{color:var(--up)}.dn{color:var(--dn)}
svg{width:100%;height:auto}
:root{--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);--cb:82%;--cs:55%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cb:28%;--cs:40%}}
:root[data-theme="dark"]{--cb:28%;--cs:40%}
main{padding:14px 12px 28px}
nav{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;gap:2px;margin-bottom:14px}
nav button{border:none;background:none;border-radius:10px;color:var(--mu)}
nav button.on{background:var(--ac);color:var(--bg)}
.card{border-radius:14px;box-shadow:var(--sh);padding:14px}
h2{font-size:18px;letter-spacing:-.01em}
h3{font-size:15px;font-weight:650}
button{cursor:pointer;transition:transform .08s,background .15s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
button.b{border-radius:10px;padding:9px 14px}
button.p{box-shadow:0 2px 8px rgba(15,118,110,.25)}
.cal{gap:4px}
.cal .h{font-weight:600;padding:2px 0}
.d{min-height:70px;border-radius:10px;padding:4px;transition:transform .08s,border-color .15s}
.d:active{transform:scale(.96)}
.d:hover{border-color:var(--ac)}
.d.w{border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
.d b{display:inline-flex;min-width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;font-size:12px}
.d.t{border-width:1px;border-color:var(--ac)}
.d.t b{background:var(--ac);color:var(--bg)}
.chip{background:hsl(var(--h,170) var(--cs) var(--cb));border-radius:5px;padding:1px 4px;font-weight:500}
.hint{border-radius:10px;border-left:3px solid var(--ac)}
.set input,.set select{border-radius:8px;text-align:center}
.set input:nth-child(5){text-align:left}
th{color:var(--mu);font-weight:600;font-size:12px}
table tr:last-child td{border-bottom:none}
:root:root:root{--bg:#0b0c0d;--card:#151618;--tx:#f4f4f2;--mu:#8b8d91;--bd:#26282c;--ac:#bef264;--ac2:#1d2a0c;--up:#bef264;--dn:#f87171;--cb:30%;--cs:45%;color-scheme:dark}
body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}
main{padding-bottom:110px}
header{margin:4px 0 16px}
h1{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-size:48px;line-height:1;margin:0;font-weight:700;text-transform:uppercase}
h1 span{color:var(--ac)}
#dt{text-transform:capitalize;margin-top:4px;font-size:15px}
h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
h2{font-size:22px}h3{font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;border:none;border-top:1px solid var(--bd);border-radius:0;background:var(--card);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));gap:0}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;background:none;border:none;color:var(--mu)}
nav button.on{background:none;color:var(--ac)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button.p{color:#0b0c0d;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:14px;box-shadow:0 4px 18px rgba(190,242,100,.25)}
.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:600;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.pill{padding:8px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font:inherit;font-size:15px}
.pill.on{background:var(--ac);color:#0b0c0d;border-color:var(--ac);font-weight:600}
input,select,textarea{border-radius:12px}
.th{width:48px;height:48px;border-radius:12px;background:#1d1f22;flex:none;display:inline-flex;padding:5px}
.th.sm{width:38px;height:38px;padding:4px}
.pic{width:100%;height:100%;stroke:var(--ac);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pic .m{stroke:var(--mu);stroke-width:2}
.pic .f{fill:var(--ac);stroke:none}
.exl{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.exr{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--bd);border-radius:14px;background:var(--bg)}
.exr.on{border-color:var(--ac);color:var(--ac)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tile{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--mu);font:inherit;font-size:14px;text-align:left}
.tile.on{background:var(--ac);color:#0b0c0d;border-color:var(--ac);font-weight:600}
.tile.on .th{background:#0b0c0d}
</style>
</head>
<body>
<main>
<header><h1>Bitácora <span>Gym</span></h1><div id="dt" class="mu"></div></header>
<nav id="nav"></nav>
<div id="app"></div>
</main>
<script>
var CAT={"Pecho":["Máquina apertura de pecho","Banco plano con barra","Máquina hammer","Press inclinado con mancuernas","Banco inclinado con barra","Cruce de poleas","Fondos"],
"Hombro":["Press militar","Elevación frontal con barra","Elevación lateral","Pájaros","Press Arnold"],
"Espalda":["Jalón al pecho","Remo con barra","Remo en máquina","Dominadas","Pullover"],
"Bíceps":["Curl con barra","Curl martillo","Curl predicador","Curl con mancuernas"],
"Tríceps":["Extensión en polea","Press francés","Fondos en banco","Patada de tríceps"],
"Pierna":["Sentadilla","Prensa","Extensión de cuádriceps","Curl femoral","Peso muerto rumano","Pantorrilla de pie"],
"Glúteo":["Hip thrust","Patada en polea","Abducción en máquina"],
"Abdomen":["Crunch","Plancha","Elevación de piernas"]};
var MF=[["peso","Peso corporal (kg)"],["pecho","Pecho"],["hombros","Hombros"],["cintura","Cintura"],["cadera","Cadera"],["brazoD","Brazo der."],["brazoI","Brazo izq."],["muslo","Muslo"],["pantorrilla","Pantorrilla"]];
CAT["Otro"]=[];var DAYS=["L","M","X","J","V","S","D"];
var S={logs:{},meas:[],custom:{}};
try{var raw=localStorage.getItem("gymlog");if(raw){var p=JSON.parse(raw);if(p&&p.logs)S=p;}}catch(e){}
function save(){try{localStorage.setItem("gymlog",JSON.stringify(S));}catch(e){}}
if(!S.cat){S.cat={};Object.keys(CAT).forEach(function(k){S.cat[k]=CAT[k].concat((S.custom||{})[k]||[])})}
var V={tab:"cal",day:null,y:0,m:0,pm:"",pe:"",ed:null,ad:null};
if(!S.car)S.car={};
if(!S.cl)S.cl=["Caminadora","Bicicleta estática","Elíptica","Escaladora","Remo","Air bike","Escalera (stairmaster)","Correr al aire libre","Natación","Saltar la cuerda"];
var now=new Date();V.y=now.getFullYear();V.m=now.getMonth();
function pad(n){return n<10?"0"+n:""+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getMonth()>=0?d.getDate():0)}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2],12)}
var TODAY=ymd(now);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function exs(m){return (S.cat&&S.cat[m])||[]}
function long(s){return pd(s).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"})}
function short(s){return pd(s).toLocaleDateString("es-MX",{day:"numeric",month:"short"})}
function sum(sets){return sets.map(function(x){return x.s+(x.r!==""&&x.r!=null?"×"+x.r:" serie(s)")+(x.w!==""&&x.w!=null?" @ "+x.w+" "+x.u:"")+(x.n?" "+x.n:"")}).join(" · ")}
function last(e,before){var ds=Object.keys(S.logs).filter(function(d){return d<before}).sort().reverse();
 for(var i=0;i<ds.length;i++){var f=S.logs[ds[i]].filter(function(x){return x.e===e});if(f.length)return{d:ds[i],sets:f[0].sets}}return null}
function nav(){var t=[["cal","📅 Calendario"],["prog","📈 Progreso"],["med","📏 Medidas"],["ex","🏋️ Ejercicios"]];
 document.getElementById("nav").innerHTML=t.map(function(x){return '<button class="'+(V.tab===x[0]?"on":"")+'" onclick="V.tab=\''+x[0]+'\';V.day=null;R()">'+x[1]+'</button>'}).join("")}
function R(){nav();var a=document.getElementById("app");a.innerHTML=V.add?addV():V.tab==="cal"?(V.day?dayV():calV()):V.tab==="car"?carV():V.tab==="prog"?progV():V.tab==="ex"?exV():medV()}

function calV(){
 var first=new Date(V.y,V.m,1,12),off=(first.getDay()+6)%7,start=new Date(V.y,V.m,1-off,12);
 var h='<button class="b p" style="width:100%;padding:12px;margin-bottom:10px;font-size:16px" onclick="openAdd(TODAY)">✍️ ¿Qué hiciste hoy?</button><div class="card"><div class="row sp"><button class="b" onclick="mv(-1)">‹</button><h2 style="margin:0;text-transform:capitalize">'+first.toLocaleDateString("es-MX",{month:"long",year:"numeric"})+'</h2><button class="b" onclick="mv(1)">›</button></div></div><div class="cal">';
 DAYS.forEach(function(d){h+='<div class="h">'+d+'</div>'});
 for(var i=0;i<42;i++){var d=new Date(start);d.setDate(start.getDate()+i);var k=ymd(d),L=S.logs[k]||[];
  var ms=[];L.forEach(function(x){if(ms.indexOf(x.m)<0)ms.push(x.m)});if((S.car[k]||[]).length)ms.push("Cardio");
  h+='<div class="d'+(d.getMonth()!==V.m?" o":"")+(k===TODAY?" t":"")+(ms.length?" w":"")+'" onclick="openDay(\''+k+'\')"><b>'+d.getDate()+'</b>'+ms.slice(0,2).map(function(m){return '<span class="chip" style="--h:'+hue(m)+'">'+esc(m)+'</span>'}).join("")+(ms.length>2?'<span class="mu">+'+(ms.length-2)+'</span>':"")+'</div>'}
 h+='</div><p class="mu">Toca un día para registrar o ver lo que hiciste.</p>';
 return h}
function mv(n){V.m+=n;if(V.m<0){V.m=11;V.y--}if(V.m>11){V.m=0;V.y++}R()}
function openDay(k){V.day=k;V.ee=null;V.cd=null;R()}

function dayV(){
 var k=V.day,L=S.logs[k]||[];
 var h='<div class="row sp" style="margin-bottom:8px"><button class="b" onclick="V.day=null;R()">‹ Calendario</button><h2 style="margin:0;text-transform:capitalize">'+long(k)+'</h2></div><button class="b p" style="width:100%;margin-bottom:10px" onclick="openAdd(\''+k+'\')">✍️ Escribir lo que hice este día</button>';
 L.forEach(function(x,i){
  var lt=last(x.e,k);
  h+='<div class="card" style="border-left:4px solid hsl('+hue(x.m)+' 55% 50%)"><div class="row"><span class="th">'+ico(iconFor(x.m,x.e))+'</span><h3 style="flex:1">'+esc(x.m)+' · '+esc(x.e)+'</h3>'+(V.ee===i?'':'<button class="x" style="color:var(--tx)" onclick="V.ee='+i+';V.cd=null;R()">✏️</button>')+'</div>'+(V.ee===i?editBox(k,i):'')
  +(lt?'<div class="hint">Última vez ('+short(lt.d)+'): '+esc(sum(lt.sets))+'</div>':'<div class="hint">Primera vez que registras este ejercicio</div>')
  +'<div class="lab"><span>Series</span><span>Reps</span><span>Peso</span><span>Unidad</span><span>Nota</span><span></span></div>';
  x.sets.forEach(function(s,j){
   h+='<div class="set"><input type="number" inputmode="numeric" value="'+esc(s.s)+'" onchange="up('+i+','+j+',\'s\',this.value)"><input type="number" inputmode="numeric" value="'+esc(s.r)+'" onchange="up('+i+','+j+',\'r\',this.value)"><input type="number" inputmode="decimal" step="0.5" value="'+esc(s.w)+'" onchange="up('+i+','+j+',\'w\',this.value)"><select onchange="up('+i+','+j+',\'u\',this.value)"><option'+(s.u==="kg"?" selected":"")+'>kg</option><option'+(s.u==="lb"?" selected":"")+'>lb</option></select><input placeholder="+ barra, por lado…" value="'+esc(s.n)+'" onchange="up('+i+','+j+',\'n\',this.value)"><button class="x" onclick="delSet('+i+','+j+')">×</button></div>'});
  h+='<div style="margin-top:8px"><button class="b" onclick="addSet('+i+')">+ Agregar serie / peso</button></div></div>'});
 h+=cardioDay(k);var ms=Object.keys(CAT);
 h+='<div class="card"><h2>Agregar ejercicio</h2><div class="lbl">Grupo muscular</div><div class="chips" id="chips">'+ms.map(function(m,i){return '<button class="pill'+(i?'':' on')+'" onclick="pickM(\''+m+'\',this)">'+m+'</button>'}).join("")+'</div><div class="lbl">Ejercicio / aparato</div><div class="row"><select id="sm" style="display:none" onchange="V.pm=this.value;fillEx()">'+ms.map(function(m){return '<option>'+m+'</option>'}).join("")+'</select><select id="se" style="display:none"></select></div><div id="exl" class="exl"></div><div class="row" style="margin-top:6px"><input id="sn" placeholder="o escribe un ejercicio nuevo" style="flex:1"><button class="b p" onclick="addEx()">Agregar</button></div></div>';
 setTimeout(fillEx,0);
 return h}
function fillEx(){var m=document.getElementById("sm");if(!m)return;var e=document.getElementById("se");e.innerHTML=exs(m.value).map(function(x){return '<option>'+esc(x)+'</option>'}).join("")}
function addEx(){var m=document.getElementById("sm").value,n=document.getElementById("sn").value.trim(),e=n||document.getElementById("se").value;if(!e)return;
 if(n&&exs(m).indexOf(n)<0){(S.cat[m]=S.cat[m]||[]).push(n)}
 var lt=last(e,V.day),f=lt?lt.sets[0]:{s:4,r:12,w:"",u:"kg",n:""};
 (S.logs[V.day]=S.logs[V.day]||[]).push({m:m,e:e,sets:[{s:f.s,r:f.r,w:f.w,u:f.u,n:f.n}]});save();R()}
function up(i,j,f,v){var s=S.logs[V.day][i].sets[j];s[f]=(f==="u"||f==="n")?v:(v===""?"":+v);save()}
function addSet(i){var st=S.logs[V.day][i].sets,l=st[st.length-1];st.push({s:l.s,r:l.r,w:l.w,u:l.u,n:""});save();R()}
function delSet(i,j){var st=S.logs[V.day][i].sets;st.splice(j,1);if(!st.length)S.logs[V.day].splice(i,1);if(!S.logs[V.day].length)delete S.logs[V.day];save();R()}
function delEx(k,i){V.cd=null;V.ee=null;S.logs[k].splice(i,1);if(!S.logs[k].length)delete S.logs[k];save();R()}

function kg(s){return s.u==="lb"?s.w*0.4536:+s.w}
function progV(){
 var all={};Object.keys(S.logs).forEach(function(d){S.logs[d].forEach(function(x){all[x.m]=all[x.m]||{};all[x.m][x.e]=1})});
 var ms=Object.keys(all);
 if(!ms.length)return '<div class="card"><h2>Progreso</h2><p class="mu">Aún no hay registros. Anota tu primer entrenamiento en el calendario y aquí verás cómo avanzan tus pesos.</p></div>';
 if(ms.indexOf(V.pm)<0){V.pm=ms[0];V.pe=""}
 var es=Object.keys(all[V.pm]);if(es.indexOf(V.pe)<0)V.pe=es[0];
 var h='<div class="card"><h2>Progreso por ejercicio</h2><div class="row"><select onchange="V.pm=this.value;R()">'+ms.map(function(m){return '<option'+(m===V.pm?" selected":"")+'>'+m+'</option>'}).join("")+'</select><select style="flex:1" onchange="V.pe=this.value;R()">'+es.map(function(m){return '<option'+(m===V.pe?" selected":"")+'>'+esc(m)+'</option>'}).join("")+'</select></div></div>';
 var pts=[];Object.keys(S.logs).sort().forEach(function(d){S.logs[d].forEach(function(x){if(x.e===V.pe){var mx=Math.max.apply(null,x.sets.map(kg));pts.push({d:d,v:mx,sets:x.sets})}})});

function iconFor(m,e){var n=nz(e);for(var i=0;i<IK.length;i++)if(IK[i][0].test(n))return IK[i][1];return GP[m]||"gen"}
function cIcon(a){var n=nz(a);return /bicicleta|bike|spinning/.test(n)?"bike":/escalera|escaladora|stair/.test(n)?"stairs":/nata/.test(n)?"swim":/cuerda|salt/.test(n)?"rope":/remo/.test(n)?"row":"run"}
HUE.Cardio=190;
function fillEx(){var m=document.getElementById("sm");if(!m)return;var e=document.getElementById("se"),L=exs(m.value);
 e.innerHTML=L.map(function(x){return '<option>'+esc(x)+'</option>'}).join("");
 document.getElementById("exl").innerHTML=L.length?L.map(function(x,i){return '<div class="exr'+(i?'':' on')+'" onclick="pickE('+i+')"><span class="th">'+ico(iconFor(m.value,x))+'</span><span>'+esc(x)+'</span></div>'}).join(""):'<div class="mu">No hay ejercicios en este grupo. Escribe uno abajo.</div>'}
function pickE(i){document.getElementById("se").selectedIndex=i;document.querySelectorAll("#exl .exr").forEach(function(r,j){r.classList.toggle("on",j===i)})}
function cdesc(e){return [e.t?e.t+" min":"",e.k!==""&&e.k!=null?e.k+" km":""].filter(Boolean).join(" · ")}
function crow(d,i,e){var key=d+"|"+i;return '<div class="row sp" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span class="row"><span class="th sm">'+ico(cIcon(e.a))+'</span><span><b>'+esc(e.a)+'</b><div class="mu">'+(V.tab==="cal"?"":short(d)+" · ")+cdesc(e)+'</div></span></span>'+(V.cc===key?'<span class="row"><button class="b" onclick="delCar(\''+d+'\','+i+')">¿Borrar? Sí</button><button class="b" onclick="V.cc=null;R()">No</button></span>':'<button class="x" onclick="V.cc=\''+key+'\';R()">🗑</button>')+'</div>'}
function cardioDay(k){var L=S.car[k]||[];if(!L.length)return "";return '<div class="card" style="border-left:4px solid hsl(190 55% 50%)"><h3>Cardio</h3>'+L.map(function(e,i){return crow(k,i,e)}).join("")+'</div>'}
function carV(){if(V.ca==null)V.ca=0;var d=V.cdt||TODAY;
 var h='<div class="card"><h2>Cardio</h2><div class="row" style="margin-bottom:8px"><span class="mu">Día:</span><input type="date" id="cdate" value="'+d+'" onchange="V.cdt=this.value"></div><div class="lbl">Máquina / actividad</div><div class="tiles">'+S.cl.map(function(a,i){return '<button class="tile'+(V.ca===i?' on':'')+'" onclick="V.ca='+i+';pickC(this)"><span class="th sm">'+ico(cIcon(a))+'</span><span>'+esc(a)+'</span></button>'}).join("")+'</div><div class="grid2" style="margin-top:12px"><div><label>Tiempo (min)</label><input type="number" inputmode="numeric" id="ct"></div><div><label>Distancia (km)</label><input type="number" inputmode="decimal" step="0.1" id="ck"></div></div><input id="co" placeholder="¿Otra actividad? Escríbela aquí" style="width:100%;margin-top:8px"><div id="ce" class="dn" style="margin-top:6px"></div><div style="margin-top:10px"><button class="b p" style="width:100%;padding:12px" onclick="addCar()">+ Agregar</button></div></div>';
 var all=[];Object.keys(S.car).sort().reverse().forEach(function(x){S.car[x].forEach(function(e,i){all.push(crow(x,i,e))})});
 return h+'<div class="card"><h2>Historial</h2>'+(all.length?all.slice(0,20).join(""):'<p class="mu" style="margin:0">Aún no hay cardio registrado.</p>')+'</div>'}
function pickC(b){document.querySelectorAll(".tile").forEach(function(t){t.classList.toggle("on",t===b)})}
function addCar(){var d=document.getElementById("cdate").value||TODAY,o=document.getElementById("co").value.trim(),a=o||S.cl[V.ca||0],t=+document.getElementById("ct").value,k=document.getElementById("ck").value;
 if(!a||!(t>0||+k>0)){document.getElementById("ce").textContent="Escribe el tiempo o la distancia.";return}
 if(o&&S.cl.indexOf(o)<0)S.cl.push(o);
 (S.car[d]=S.car[d]||[]).push({a:a,t:t||"",k:k===""?"":+k});V.cdt=d;V.ca=S.cl.indexOf(a);save();R()}
function delCar(d,i){V.cc=null;S.car[d].splice(i,1);if(!S.car[d].length)delete S.car[d];save();R()}
function cardioParse(line){var n=nz(line);
 var mt=n.match(/(\d+(?:[.,]\d+)?)\s*(?:mins?|minutos?)\b/),mk=n.match(/(\d+(?:[.,]\d+)?)\s*(?:kms?|kilometros?)\b/);
 if(!mt&&!mk)return null;if(/\d\s*(?:kgs?|kilos?|lbs?|libras?)\b/.test(n))return null;
 var w=n.split(/[^a-z0-9]+/),act=null;
 S.cl.forEach(function(a){var t=tk(a)[0];if(t&&w.indexOf(t)>=0&&(!act||a.length>act.length))act=a});
 if(!act&&!/caminad|trotad|bici|eliptic|escaladora|escalera|stair|correr|corri|trote|caminata|natacion|nadar|cuerda|spinning|cardio/.test(n))return null;
 var nm=act;if(!nm){var i=line.search(/\d/);nm=(i<0?line:line.slice(0,i)).replace(/[\s,:;\-–]+$/,"").trim();nm=nm.charAt(0).toUpperCase()+nm.slice(1)}
 return{cardio:1,a:nm,t:mt?+mt[1].replace(",","."):"",k:mk?+mk[1].replace(",","."):""}}
function cset(i,f,v){V.add.items[i][f]=f==="a"?v:(v===""?"":+v)}
function cardioPrev(x,i){return '<div class="card" style="border-left:4px solid hsl(190 55% 50%)"><div class="row"><span class="th sm">'+ico(cIcon(x.a))+'</span><b class="mu">CARDIO</b><input style="flex:1" value="'+esc(x.a)+'" data-f="a" onchange="cset('+i+',this.dataset.f,this.value)"><button class="x" onclick="V.add.items.splice('+i+',1);R()">×</button></div><div class="grid2" style="margin-top:8px"><div><label>Tiempo (min)</label><input type="number" step="0.01" value="'+esc(x.t)+'" data-f="t" onchange="cset('+i+',this.dataset.f,this.value)"></div><div><label>Distancia (km)</label><input type="number" step="0.01" value="'+esc(x.k)+'" data-f="k" onchange="cset('+i+',this.dataset.f,this.value)"></div></div></div>'}
var CL0=["Caminadora","Bicicleta estática","Elíptica","Escaladora","Remo","Air bike","Escalera (stairmaster)","Correr al aire libre","Natación","Saltar la cuerda"];
function bkCard(){return '<div class="card"><h3>Respaldo de datos</h3><p class="mu" style="margin:6px 0 10px">Descarga una copia de todo tu historial. Si cambias de celular o se borran los datos del navegador, podrás restaurarlo aquí.</p><div class="row"><button class="b p" onclick="dlBk()">⬇ Descargar</button><button class="b" onclick="pickBk()">Restaurar</button><input id="bkf" type="file" accept=".json,application/json" style="display:none" onchange="rdBk(this.files[0])"></div>'+(V.rs?'<div class="hint" style="margin-top:10px">Este respaldo tiene '+Object.keys(V.rs.logs||{}).length+' días de fuerza y '+Object.keys(V.rs.car||{}).length+' de cardio. ¿Reemplazar tus datos actuales?<div class="row" style="margin-top:8px"><button class="b p" onclick="okBk()">Sí, restaurar</button><button class="b" onclick="V.rs=null;R()">Cancelar</button></div></div>':'')+(V.rm?'<div class="dn" style="margin-top:8px">'+V.rm+'</div>':'')+'</div>'}
function pickBk(){document.getElementById("bkf").click()}
function dlBk(){var b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="respaldo-gym-"+TODAY+".json";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function rdBk(f){if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||typeof o.logs!=="object")throw 0;V.rs=o;V.rm=""}catch(e){V.rs=null;V.rm="Ese archivo no es un respaldo válido."}R()};r.readAsText(f)}
function okBk(){var o=V.rs;o.logs=o.logs||{};o.meas=o.meas||[];S=o;
 if(!S.cat){S.cat={};Object.keys(CAT).forEach(function(k){S.cat[k]=CAT[k].slice()})}
 if(!S.car)S.car={};if(!S.cl)S.cl=CL0.slice();
 V.rs=null;V.rm="";save();R()}
document.getElementById("dt").textContent=long(TODAY);
R();
</script>
